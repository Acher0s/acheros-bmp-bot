<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conjoined overlay text</title>
<style>
  @font-face { font-family: "m6x11"; src: url("/overlay/m6x11.ttf") format("truetype"); }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  /* The text fills the Browser Source's box: centered, as large as fits (see fit()) */
  body { display: flex; align-items: center; justify-content: center; }
  #text {
    font-family: "m6x11", monospace;
    -webkit-font-smoothing: none;
    font-size: 72px;
    line-height: 1;
    color: #000;
    white-space: nowrap;
  }
</style>
</head>
<body>
<span id="text"></span>
<script>
(() => {
  // /overlay/slot/<slot>/<field> (team, p1, p2, standing) or /overlay/round
  const parts = location.pathname.split("/").filter(Boolean);
  const slot = parts[1] === "slot" ? parts[2] : null;
  const field = parts[1] === "slot" ? parts[3] : "round";
  const params = new URLSearchParams(location.search);
  const el = document.getElementById("text");
  const FLEX = {left: "flex-start", top: "flex-start", center: "center", middle: "center", right: "flex-end",
                bottom: "flex-end"};
  // size=N: the largest the text may get (default: whatever fits the box)
  const maxSize = parseInt(params.get("size"), 10) || 1000;
  if (params.get("align")) {
    document.body.style.justifyContent = FLEX[params.get("align")] || "center";
    el.style.textAlign = params.get("align");
  }
  if (params.get("valign")) document.body.style.alignItems = FLEX[params.get("valign")] || "center";
  if (params.get("color")) el.style.color = "#" + params.get("color").replace("#", "");

  // The largest whole-pixel size at which the text fits the source's width and height
  function fit() {
    const width = window.innerWidth, height = window.innerHeight;
    if (!el.textContent || !width || !height) return;
    const fits = (size) => {
      el.style.fontSize = size + "px";
      return el.offsetWidth <= width && el.offsetHeight <= height;
    };
    let low = 4, high = Math.min(maxSize, height);
    if (fits(high)) return;
    while (high - low > 1) {
      const mid = Math.floor((low + high) / 2);
      if (fits(mid)) low = mid; else high = mid;
    }
    fits(low);
  }
  window.addEventListener("resize", fit);  // the source was resized in OBS

  async function tick() {
    try {
      const key = params.get("key") || "";
      const resp = await fetch("/overlay/state.json?key=" + encodeURIComponent(key), { cache: "no-store" });
      if (resp.ok) {
        const state = await resp.json();
        let value = "";
        if (field === "round") value = state.round ? state.round.label : "";
        else if (state.slots[slot]) value = state.slots[slot][field] || "";
        if (el.textContent !== value) { el.textContent = value; fit(); }
      }
    } catch (e) { /* bot restarting: keep the last text */ }
    setTimeout(tick, 2000);
  }
  document.fonts.load('72px "m6x11"').finally(tick);
})();
</script>
</body>
</html>
